name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      claude_code_version:
        description: "Claude Code version (default: latest on npm)"
        required: false
      force:
        description: Rebuild even if the version tag already exists
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck start.sh reaper.sh healthcheck.sh

  image:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve Claude Code version and image name
        id: v
        env:
          INPUT_VERSION: ${{ inputs.claude_code_version }}
        run: |
          version=${INPUT_VERSION:-$(npm view @anthropic-ai/claude-code version)}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "Claude Code $version"

      # Scheduled and manual runs only build a Claude Code version not published yet.
      - name: Skip if this version is already published
        id: skip
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.force)
        run: |
          if docker buildx imagetools inspect "${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "Image for Claude Code ${{ steps.v.outputs.version }} already published."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.skip.outputs.skip != 'true'

      - uses: docker/metadata-action@v5
        if: steps.skip.outputs.skip != 'true'
        id: meta
        with:
          images: ${{ steps.v.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ steps.v.outputs.version }},enable=${{ github.event_name != 'pull_request' }}
            type=ref,event=tag
            type=ref,event=pr

      - name: Build
        if: steps.skip.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: claude-code-nas:ci
          build-args: CLAUDE_CODE_VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the bundled Claude Code version
        if: steps.skip.outputs.skip != 'true'
        run: |
          got=$(docker run --rm claude-code-nas:ci claude --version)
          echo "$got"
          case "$got" in "${{ steps.v.outputs.version }} "*) ;; *) echo "expected ${{ steps.v.outputs.version }}"; exit 1 ;; esac

      - uses: docker/login-action@v3
        if: steps.skip.outputs.skip != 'true' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: steps.skip.outputs.skip != 'true' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: CLAUDE_CODE_VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha
