# Tools for your AI, installed into the home volume at start (no root needed).
# Any tool from https://mise.jdx.dev/registry.html, one line each.
[tools]
python = "3.13"
node = "24"
go = "1.27"
"npm:pnpm" = "latest"
uv = "latest"
ruff = "latest"

